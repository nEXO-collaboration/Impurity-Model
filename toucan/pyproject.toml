[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TOUCAN"
version = "0.1.1"
description = "Toolkit for Outgassing Contamination Analysis (TOUCAN)"
authors = [{name = "Antoine Amy", email = "antoine.amy@subatech.in2p3.fr"}]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}